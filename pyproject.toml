[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-finngen"
version = "0.1.0"
description = "Agentic workflow for deep clinical insight from FinnGen"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4",
    "requests",
    "python-dotenv",
    "pandas",
    "google-genai",
    "anthropic"
]

[project.optional-dependencies]
# Needed for the OpenAI-compatible providers: openai, xai, deepseek, mistral,
# groq, together, openrouter, and any local OpenAI-compatible server.
openai = ["openai"]

[project.scripts]
agentic-finngen = "agentic_finngen.main:main"

[tool.setuptools.packages.find]
where = ["src"]
