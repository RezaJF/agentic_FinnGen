[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-finngen"
version = "0.1.0"
description = "Agentic workflow for FinnGen analysis using Google ADK"
requires-python = ">=3.10"
dependencies = [
    "google-adk",
    "beautifulsoup4",
    "requests",
    "python-dotenv",
    "pandas",
    "google-genai",
    "anthropic"
]

[project.scripts]
agentic-finngen = "agentic_finngen.main:main"

[tool.setuptools.packages.find]
where = ["src"]
